<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Konfersi Suhu - Sammy</title>

    <link rel= "stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Website Konfersi Suhu - Sammy</h1>
    </header>

    <main>
        <!-- intro -->
        <section>
            <p>this is a temperatur confertion web</p>
        </section>

        <form>
            <div>
                <label for="konfersi-input">Celcius (&deg;C):</label>
            </div>

            <div>
                <textarea id="konfersi-input"></textarea>
            </div>

            <div>
                <button>Konfersi</button>
                <button>Reset</button>
                <button>Reverse</button>
            </div>
        </form>

        <section>
            <div>
                <label for="result-input">Fahrenheit (&deg;F):</label>
            </div>

            <div>
                <textarea id="result-input" readonly></textarea>
            </div>
        </section>

        <section>
            <div>
                <label for="calculate-detail">Cara Kalkulasi</label>
            </div>

            <div>
                <textarea id="calculate-detail" readonly></textarea>
            </div>
        </section>

        <section>
            <header>
                <h1>Cara konfersi Dari Celcius (&deg;C) Ke Fahrenheit (&deg;F)</h1>
            </header>

            <hr/>
            <!-- Konten informasi -->
            <article>
                <p>Suhu <span class="formula">S</span> dalam derajat Fahrenheit (&deg;F)</p>

                <!-- formula -->
                <div>
                    <span class="formula">S </span> <sub>(&deg;F)</sub> </div>
            </article>
        </section>
    </main>

    <footer></footer>
    
</body>
</html>
